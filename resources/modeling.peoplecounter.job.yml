resources:
  jobs:
    retail_people_counter_continuous:
      name: retail-simulator
      description: >-
        Keeps the people-counter pipeline running, so it picks up every event the people-stream app writes. Resume it for a session and pause it when done; it keeps running through every app START. See doc/pipeline.md, "Running the pipeline".
      # Continuous: the job keeps a pipeline update running (a micro-batch every 2 seconds per table,
      # pipelines.trigger.interval in the pipeline's settings), and starts a new one if it ends or fails.
      # Created paused (development mode pauses it on every deploy anyway): Resume it in the job's page.
      continuous:
        pause_status: PAUSED
      tasks:
        - task_key: run_pipeline
          pipeline_task:
            pipeline_id: ${resources.pipelines.retail_people_counter_bronze.id}
            # No full_refresh here: it would empty and rebuild the tables on every update.
            # A full refresh is housekeeping: a separate, manual pipeline run, with this job paused.
