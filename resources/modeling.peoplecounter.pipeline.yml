resources:
  pipelines:
    retail_people_counter_bronze:
      name: retail-people-counter-bronze-${bundle.target}
      catalog: ${var.catalog}
      schema: ${var.schema}
      serverless: true
      configuration:
        # Micro-batch interval of every streaming table while the job keeps the pipeline running.
        # The default is 5 seconds per table; bronze and silver are chained, so 2 seconds brings
        # source -> silver well under 5 seconds. See doc/pipeline.md, "Running the pipeline".
        pipelines.trigger.interval: "2 seconds"
      libraries:
        - file:
            path: ../src/pipelines/00_check_tables.py
        - file:
            path: ../src/pipelines/01_bronze.py
        - file:
            path: ../src/pipelines/02_silver.py
        - file:
            path: ../src/pipelines/03_sales.py
