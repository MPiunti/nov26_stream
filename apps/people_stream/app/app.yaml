command: ["python", "app.py"]

env:
  # Injected from the app's sql-warehouse resource (resources/people_stream.app.yml).
  - name: DATABRICKS_WAREHOUSE_ID
    valueFrom: sql-warehouse
  # Keep these the same as the table resources in resources/people_stream.app.yml.
  - name: STORE_TABLE
    value: workspace.test02_streaming.dim_store
  - name: SOURCE_TABLE
    value: workspace.test02_streaming.simulated_event_source
  - name: CLIENT_TABLE
    value: workspace.test02_streaming.dim_client
  - name: PRODUCT_TABLE
    value: workspace.test02_streaming.dim_product
  - name: SALES_TABLE
    value: workspace.test02_streaming.simulated_sales_source
# Store and simulation parameters (opening hours, N_AVG_PEOPLE, day length, run length, batch
# interval) are in shop_config.yml. See doc/people_stream.md, "Configuration".
