resources:
  apps:
    people_stream:
      name: ${var.app_name}
      description: People-stream simulator. START/STOP simulated people-counter events into the pipeline's source table. See doc/people_stream.md.
      # The start command and environment variables are in app/app.yaml.
      source_code_path: ../app
      # Granted to the app's service principal on deploy. dim_store and simulated_event_source
      # must already exist: run src/sql/01, 02 and 04 of the pipeline bundle first.
      resources:
        - name: sql-warehouse
          sql_warehouse:
            id: ${var.warehouse_id}
            permission: CAN_USE
        - name: store-table
          uc_securable:
            securable_full_name: ${var.catalog}.${var.schema}.dim_store
            securable_type: TABLE
            permission: SELECT
        - name: source-table-read
          uc_securable:
            securable_full_name: ${var.catalog}.${var.schema}.simulated_event_source
            securable_type: TABLE
            permission: SELECT
        - name: source-table-write
          uc_securable:
            securable_full_name: ${var.catalog}.${var.schema}.simulated_event_source
            securable_type: TABLE
            permission: MODIFY
