command: ["python", "app.py"]

env:
  # Injected from the app's sql-warehouse resource (resources/sales_dashboard.app.yml).
  - name: DATABRICKS_WAREHOUSE_ID
    valueFrom: sql-warehouse
  # Keep these the same as the table resources in resources/sales_dashboard.app.yml.
  - name: SALES_TABLE
    value: workspace.test02_streaming.current_sales_transactions
  - name: PEOPLE_TABLE
    value: workspace.test02_streaming.current_people_counter_events
  - name: STORE_TABLE
    value: workspace.test02_warehouse.dim_store
  - name: PRODUCT_TABLE
    value: workspace.test02_warehouse.dim_product
  # Metric views of the Clienteling tab (doc/kpi_metrics.md).
  - name: CLIENT_METRICS
    value: workspace.test02_metric.client_metrics
  - name: STORE_METRICS
    value: workspace.test02_metric.store_metrics
  # Ask Genie tab: the Genie agent's id, injected from the app's genie-space resource.
  - name: GENIE_SPACE_ID
    valueFrom: genie-space
  # Seconds between two refreshes of the screen (at least 2). See doc/sales_dashboard.md, "Freshness".
  - name: REFRESH_SECONDS
    value: "5"
