resources:
  apps:
    sales_dashboard:
      name: ${var.app_name}
      description: Sales BI dashboard. Live sales and people performance from the silver tables, with drill-down. Read-only. See doc/sales_dashboard.md.
      # The start command and environment variables are in app/app.yaml.
      source_code_path: ../app
      # Granted to the app's service principal on deploy: SELECT only, nothing is written.
      # It reads silver through the current-simulation views, which must already exist:
      # deploy and run the pipeline, then run src/sql/15_create_current_simulation_views.sql.
      resources:
        - name: sql-warehouse
          sql_warehouse:
            id: ${var.warehouse_id}
            permission: CAN_USE
        - name: sales-table
          uc_securable:
            securable_full_name: ${var.catalog}.${var.schema}.current_sales_transactions
            securable_type: TABLE
            permission: SELECT
        - name: people-table
          uc_securable:
            securable_full_name: ${var.catalog}.${var.schema}.current_people_counter_events
            securable_type: TABLE
            permission: SELECT
        - name: store-table
          uc_securable:
            securable_full_name: ${var.catalog}.${var.warehouse_schema}.dim_store
            securable_type: TABLE
            permission: SELECT
        - name: product-table
          uc_securable:
            securable_full_name: ${var.catalog}.${var.warehouse_schema}.dim_product
            securable_type: TABLE
            permission: SELECT
        # Clienteling tab: the metric views (doc/kpi_metrics.md), created by the job retail-metric-views.
        - name: client-metrics
          uc_securable:
            securable_full_name: ${var.catalog}.${var.metric_schema}.client_metrics
            securable_type: TABLE
            permission: SELECT
        - name: store-metrics
          uc_securable:
            securable_full_name: ${var.catalog}.${var.metric_schema}.store_metrics
            securable_type: TABLE
            permission: SELECT
        # Ask Genie tab: run the Genie agent, and read the two sources it uses that the other tabs don't.
        - name: genie-space
          genie_space:
            name: Retail KPI Assistant
            space_id: ${var.genie_space_id}
            permission: CAN_RUN
        - name: client-table
          uc_securable:
            securable_full_name: ${var.catalog}.${var.warehouse_schema}.dim_client
            securable_type: TABLE
            permission: SELECT
        - name: current-simulation
          uc_securable:
            securable_full_name: ${var.catalog}.${var.schema}.current_simulation
            securable_type: TABLE
            permission: SELECT
